{{- if .Values.kafka.enabled }}
{{- $kafka := .Values.kafka }}
# Kafka in KRaft mode: every pod is broker + controller, no ZooKeeper
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
    {{- include "olea.labels" . | nindent 4 }}
spec:
  selector: { app: kafka }
  ports:
    - name: client
      port: 9092
---
# Headless service: stable per-broker DNS names (kafka-0.kafka-headless...)
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app: kafka
    {{- include "olea.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # brokers must find each other before they are ready
  selector: { app: kafka }
  ports:
    - name: client
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    {{- include "olea.labels" . | nindent 4 }}
spec:
  serviceName: kafka-headless
  replicas: {{ $kafka.replicas }}
  podManagementPolicy: Parallel   # start all brokers together so the controller quorum can form
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      securityContext:
        fsGroup: 1000   # the image runs as uid 1000; lets it write to the volume
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: kafka }
      containers:
        - name: kafka
          image: {{ $kafka.image }}
          # Node id and advertised address come from the pod name (kafka-0, kafka-1, ...)
          command:
            - sh
            - -c
            - |
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless.{{ .Release.Namespace }}.svc.cluster.local:9092"
              exec /etc/kafka/docker/run
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: CLUSTER_ID
              value: {{ $kafka.clusterId | quote }}
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: {{ $voters := list }}{{ range $i := until (int $kafka.replicas) }}{{ $voters = append $voters (printf "%d@%s:9093" $i (include "olea.kafkaBroker" (dict "index" $i "root" $))) }}{{ end }}{{ join "," $voters | quote }}
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: {{ $kafka.replicationFactor | quote }}
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: {{ $kafka.minInsyncReplicas | quote }}
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: {{ $kafka.replicationFactor | quote }}
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: {{ $kafka.replicationFactor | quote }}
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: {{ $kafka.minInsyncReplicas | quote }}
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: {{ $kafka.heapOpts | quote }}
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9093 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml $kafka.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ $kafka.storage }}
---
# Creates the topics after every install/upgrade (idempotent: --if-not-exists).
# A Helm hook, so a changed Job never hits Kubernetes' "Job template is immutable" error.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  labels:
    {{- include "olea.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: {{ $kafka.image }}
          command:
            - sh
            - -c
            - |
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1; do
                echo "waiting for kafka"; sleep 5
              done
              for topic in {{ join " " $kafka.topics }}; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
                  --topic "$topic" --partitions {{ $kafka.partitions }} \
                  --replication-factor {{ $kafka.replicationFactor }} --config min.insync.replicas={{ $kafka.minInsyncReplicas }}
              done
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
{{- end }}

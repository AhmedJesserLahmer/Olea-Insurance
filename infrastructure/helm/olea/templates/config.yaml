apiVersion: v1
kind: ConfigMap
metadata:
  name: olea-config
  labels:
    {{- include "olea.labels" . | nindent 4 }}
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- if .Values.secrets.create }}
---
# Only for local clusters (values-local.yaml); production creates the Secret by hand
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "olea.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

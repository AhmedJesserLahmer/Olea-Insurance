# Production defaults. Local clusters: add -f values-local.yaml
#   helm upgrade --install olea infrastructure/helm/olea -n olea --create-namespace

# Images are <imageRegistry>/<service image>:<imageTag>, e.g. docker.io/me/olea-api:3f9c2ab
imageRegistry: docker.io/YOUR_DOCKERHUB_USER
imageTag: latest          # CI deploys the commit SHA: --set imageTag=<sha>
imagePullPolicy: IfNotPresent

# Non-secret settings shared by the backend services (ConfigMap olea-config)
config:
  # "true" seeds demo users and enables passwordless "Get a direct access here".
  # Keep it off on any publicly reachable cluster.
  DEMO_MODE: "false"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  PINECONE_ENV: gcp-starter

# Secret olea-secrets: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, JWT_SECRET_KEY, PINECONE_API_KEY
secrets:
  # false = the Secret is created by hand (never commit real secrets):
  #   kubectl -n olea create secret generic olea-secrets --from-literal=POSTGRES_USER=olea ...
  create: false
  name: olea-secrets
  values: {}

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 5Gi
  # Set to publish the database on the host through a LoadBalancer (local clusters only;
  # never expose a production database this way)
  hostPort: null
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

kafka:
  enabled: true
  image: apache/kafka:3.9.0
  # Each broker is also a KRaft controller. 3 brokers survive the loss of one.
  replicas: 3
  replicationFactor: 3
  minInsyncReplicas: 2
  partitions: 3
  clusterId: mblbDtKqRKCsuS3Jptzm4A
  heapOpts: -Xms512m -Xmx1g
  storage: 10Gi
  topics:
    - client.profile.submitted
    - prediction.completed
    - chat.completed
    - history.dead-letter
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 2Gi }

# One Deployment (and Service, when serviceName is set) per entry
services:
  frontend:
    image: olea-frontend
    serviceName: frontend-svc
    replicas: 2
    port: 3000
    healthPath: /
    backend: false
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

  api:
    image: olea-api
    serviceName: api-svc
    replicas: 2
    port: 8000
    healthPath: /health
    backend: true
    waitForPostgres: true   # creates the schema on startup
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { memory: 512Mi }

  prediction:
    image: olea-prediction
    serviceName: prediction-svc
    replicas: 2
    port: 8000
    healthPath: /health
    backend: true
    startupFailureThreshold: 24   # loads model.pkl before listening
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 1Gi }

  rag:
    image: olea-rag
    serviceName: rag-svc
    # Memory-heavy: 1 replica, so the chat is down while its pod restarts
    replicas: 1
    port: 8000
    healthPath: /health
    backend: true
    startupFailureThreshold: 36
    modelCacheSize: 8Gi   # emptyDir for downloaded Hugging Face models
    resources:
      requests: { cpu: 500m, memory: 3Gi }
      limits: { memory: 6Gi }

  history-writer:
    image: olea-history-writer
    serviceName: ""   # Kafka consumer, receives no traffic
    replicas: 2
    port: 8081
    healthPath: /health
    backend: true
    waitForPostgres: true
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

ingress:
  enabled: true
  className: nginx
  host: olea.example.com   # "" matches any host (local clusters)
  ragReadTimeout: "300"    # seconds; the first answer loads the model

# Local stand-in for the Kubernetes NGINX Ingress: one entry point, routed by path.
# Upstreams are resolved per request through Docker's DNS, so the gateway starts
# (and keeps running) even while a service is restarting.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /gateway/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # api-svc: accounts + history
    location /auth/ {
        set $api http://api:8000;
        proxy_pass $api;
    }
    location /predictions/ {
        set $api http://api:8000;
        proxy_pass $api;
    }

    # prediction-svc
    location = /predict-bundle {
        set $prediction http://prediction:8000;
        proxy_pass $prediction;
    }

    # rag-svc: first answer can take a while (model loading)
    location = /rag {
        set $rag http://rag:8000;
        proxy_read_timeout 300s;
        proxy_pass $rag;
    }

    # frontend-svc: everything else
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
    }
}

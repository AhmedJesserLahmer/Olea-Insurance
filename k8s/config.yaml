# Non-secret settings shared by the backend services.
# Secrets (passwords, JWT key, Pinecone key) live in the olea-secrets Secret,
# created by hand, never committed:
#   kubectl -n olea create secret generic olea-secrets \
#     --from-literal=POSTGRES_USER=olea \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=POSTGRES_DB=olea \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=PINECONE_API_KEY=<your key>
apiVersion: v1
kind: ConfigMap
metadata:
  name: olea-config
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DEMO_MODE: "true"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  PINECONE_ENV: gcp-starter

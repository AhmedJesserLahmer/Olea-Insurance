# rag-svc: Pinecone + TinyLlama. 1 replica (memory-heavy): the chat is down while its pod restarts.
# Raise replicas to 2 if it must never stop, on nodes with enough memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag
  labels: { app: rag }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rag }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # a new pod must be ready before an old one is removed
  template:
    metadata:
      labels: { app: rag }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: rag }
      volumes:
        - name: hf-cache
          emptyDir: { sizeLimit: 8Gi }   # downloaded models; lost when the pod is replaced
      containers:
        - name: rag
          image: olea-rag
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: olea-config }
            - secretRef: { name: olea-secrets }
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 500m, memory: 3Gi }
            limits: { memory: 6Gi }
          volumeMounts:
            - name: hf-cache
              mountPath: /app/.cache/huggingface
---
apiVersion: v1
kind: Service
metadata:
  name: rag-svc
  labels: { app: rag }
spec:
  selector: { app: rag }   # every ready pod with this label receives traffic
  ports:
    - name: http
      port: 80
      targetPort: 8000

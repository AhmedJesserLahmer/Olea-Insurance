# history-writer: Kafka consumer group storing events in PostgreSQL.
# 2 replicas share the 3 partitions of each topic; no Service, it receives no traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-writer
  labels: { app: history-writer }
spec:
  replicas: 2
  selector:
    matchLabels: { app: history-writer }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # a new pod must be ready before an old one is removed
  template:
    metadata:
      labels: { app: history-writer }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: history-writer }
      containers:
        - name: history-writer
          image: olea-history-writer
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: olea-config }
            - secretRef: { name: olea-secrets }
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          startupProbe:
            httpGet: { path: /health, port: 8081 }
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }

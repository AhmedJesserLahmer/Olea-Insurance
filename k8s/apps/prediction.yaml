# prediction-svc: model.pkl predictions; publishes profile + prediction events
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction
  labels: { app: prediction }
spec:
  replicas: 2
  selector:
    matchLabels: { app: prediction }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # a new pod must be ready before an old one is removed
  template:
    metadata:
      labels: { app: prediction }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: prediction }
      containers:
        - name: prediction
          image: olea-prediction
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: olea-config }
            - secretRef: { name: olea-secrets }
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: prediction-svc
  labels: { app: prediction }
spec:
  selector: { app: prediction }   # every ready pod with this label receives traffic
  ports:
    - name: http
      port: 80
      targetPort: 8000

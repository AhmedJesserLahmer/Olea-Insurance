# NGINX Ingress: one entry point for the cluster, routed by path to each Service.
# Requires the ingress-nginx controller: https://kubernetes.github.io/ingress-nginx/deploy/
# Replace olea.example.com with your domain (or add it to /etc/hosts for local clusters).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: olea
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: olea.example.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend: { service: { name: api-svc, port: { name: http } } }
          - path: /predictions
            pathType: Prefix
            backend: { service: { name: api-svc, port: { name: http } } }
          - path: /predict-bundle
            pathType: Exact
            backend: { service: { name: prediction-svc, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend-svc, port: { name: http } } }
---
# Separate Ingress so only the chat gets the long timeout (first answer loads the model)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: olea-rag
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: olea.example.com
      http:
        paths:
          - path: /rag
            pathType: Exact
            backend: { service: { name: rag-svc, port: { name: http } } }

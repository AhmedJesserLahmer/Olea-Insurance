# Kafka: 3 brokers in KRaft mode (each pod is broker + controller, no ZooKeeper).
# Topics are replicated 3 times with min.insync.replicas=2, so writes keep
# working when one broker (or its node) is down.
# For production, the Strimzi operator (strimzi.io) manages upgrades and scaling for you.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app: kafka }
spec:
  selector: { app: kafka }
  ports:
    - name: client
      port: 9092
---
# Headless service: stable per-broker DNS names (kafka-0.kafka-headless...)
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels: { app: kafka }
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # brokers must find each other before they are ready
  selector: { app: kafka }
  ports:
    - name: client
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel   # start all brokers together so the controller quorum can form
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      securityContext:
        fsGroup: 1000   # the image runs as uid 1000; lets it write to the volume
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: kafka }
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          # Node id and advertised address come from the pod name (kafka-0, kafka-1, kafka-2)
          command:
            - sh
            - -c
            - |
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless.olea.svc.cluster.local:9092"
              exec /etc/kafka/docker/run
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: CLUSTER_ID
              value: mblbDtKqRKCsuS3Jptzm4A
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 0@kafka-0.kafka-headless.olea.svc.cluster.local:9093,1@kafka-1.kafka-headless.olea.svc.cluster.local:9093,2@kafka-2.kafka-headless.olea.svc.cluster.local:9093
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx1g
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9093 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 2Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
# Creates the event topics once the brokers answer (safe to re-run: --if-not-exists)
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command:
            - sh
            - -c
            - |
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1; do
                echo "waiting for kafka"; sleep 5
              done
              for topic in client.profile.submitted prediction.completed chat.completed history.dead-letter; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
                  --topic "$topic" --partitions 3 --replication-factor 3 --config min.insync.replicas=2
              done
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }

# Local version of the Kubernetes architecture (see docs/architecture.svg):
#   gateway (NGINX, like the Ingress) -> frontend | api | prediction | rag
#   prediction + rag publish events to Kafka -> history-writer -> PostgreSQL
#
# Usage: cp .env.example .env  (then fill in secrets)  &&  docker compose up --build
# App: http://localhost:8080
name: olea

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  # Single-node Kafka in KRaft mode (no ZooKeeper). Kubernetes runs 3 brokers.
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    mem_limit: 1g

  # One-shot job: create the event topics (like a Kubernetes Job / Strimzi KafkaTopic)
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in client.profile.submitted prediction.completed chat.completed history.dead-letter; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
    restart: "no"
    mem_limit: 512m

  # api-svc: accounts + history; creates the schema and seeds demo data
  api:
    build:
      context: ./services
      dockerfile: api/Dockerfile
    image: olea/api:local
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  prediction:
    build:
      context: ./services
      dockerfile: prediction/Dockerfile
    image: olea/prediction:local
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 1g

  rag:
    build:
      context: ./services
      dockerfile: rag/Dockerfile
    image: olea/rag:local
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    volumes:
      # Hugging Face models downloaded on the first question survive restarts
      - hf-cache:/app/.cache/huggingface
    depends_on:
      api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    # TinyLlama + embeddings need a few GB; the cap stops the RAG model from starving the host
    mem_limit: ${RAG_MEMORY_LIMIT:-6g}

  history-writer:
    build:
      context: ./services
      dockerfile: history-writer/Dockerfile
    image: olea/history-writer:local
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 512m

  frontend:
    build:
      context: ./frontend
      args:
        # Same origin: the gateway routes API paths
        NEXT_PUBLIC_API_BASE_URL: /
    image: olea/frontend:local
    restart: unless-stopped
    mem_limit: 512m

  # Local stand-in for the NGINX Ingress Controller
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/gateway/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m

volumes:
  postgres-data:
  kafka-data:
  hf-cache:

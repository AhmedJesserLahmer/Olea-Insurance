# Small footprint for a local cluster (Docker Desktop Kubernetes, k3d, kind).
# Use through scripts/k8s_local.sh, which also passes the secrets from .env.

imageRegistry: olea-local
imageTag: local
# scripts/k8s_local.sh tags each image with its content id (services.<name>.tag), so a
# rebuilt image gets a new tag. Nodes keep pulled images: no pulls after a restart.
imagePullPolicy: IfNotPresent

secrets:
  create: true   # values come from .env via --set-string (never committed)

postgres:
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

kafka:
  replicas: 1
  replicationFactor: 1
  minInsyncReplicas: 1
  heapOpts: -Xms128m -Xmx384m
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }

services:
  frontend:
    replicas: 1
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 384Mi }
  api:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { memory: 384Mi }
  prediction:
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 768Mi }
  rag:
    replicas: 1
    # Too little memory to load TinyLlama locally: /rag answers with an error, the pod stays up
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1536Mi }
  history-writer:
    replicas: 1
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 256Mi }

ingress:
  host: ""   # match any host, so http://localhost works

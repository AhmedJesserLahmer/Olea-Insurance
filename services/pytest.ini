[pytest]
# Run from services/:  pip install -r requirements-dev.txt && pytest
testpaths = shared/tests api/tests prediction/tests rag/tests all-in-one/tests
# Each service folder is an import root, like PYTHONPATH in the Docker images
pythonpath = shared api prediction rag history-writer all-in-one
# Several tests/ folders: import them by path, no __init__.py needed
addopts = --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning

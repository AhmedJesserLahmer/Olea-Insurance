# CI/CD: unit tests -> smoke tests -> build & push images to Docker Hub -> deploy to Kubernetes
#
# Repository settings needed (Settings -> Secrets and variables -> Actions):
#   secrets.DOCKERHUB_USERNAME  Docker Hub user or organization (images: <user>/olea-<service>)
#   secrets.DOCKERHUB_TOKEN     Docker Hub access token (read/write)
#   secrets.KUBE_CONFIG         base64-encoded kubeconfig for the cluster   (deploy only)
#   vars.DEPLOY_ENABLED         "true" to run the deploy job                (deploy only)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit-tests:
    name: Unit tests (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: pytest -q

  frontend-build:
    name: Unit tests (frontend build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /

  smoke-tests:
    name: Smoke tests (docker compose)
    needs: [backend-unit-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with throwaway secrets
        run: |
          sed -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=$(openssl rand -hex 32)/" \
              .env.example > .env
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Run smoke tests
        run: ./scripts/smoke_test.sh
        env:
          BASE_URL: http://localhost:8080
          SMOKE_TIMEOUT: "240"
      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  build-and-push:
    name: Build & push ${{ matrix.image }}
    needs: smoke-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: olea-api
            context: .
            file: backend/Dockerfile
            target: api
          - image: olea-prediction
            context: .
            file: backend/Dockerfile
            target: prediction
          - image: olea-rag
            context: .
            file: backend/Dockerfile
            target: rag
          - image: olea-history-writer
            context: .
            file: backend/Dockerfile
            target: history-writer
          - image: olea-frontend
            context: frontend
            file: frontend/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          # The commit tag is what Kubernetes deploys; latest is only a convenience
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
      TAG: ${{ github.sha }}
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Roll out the new images
        run: |
          # deployment=container:image
          for spec in api=api:olea-api prediction=prediction:olea-prediction rag=rag:olea-rag \
                      history-writer=history-writer:olea-history-writer frontend=frontend:olea-frontend; do
            deployment="${spec%%=*}"; rest="${spec#*=}"; container="${rest%%:*}"; image="${rest#*:}"
            kubectl -n olea set image "deployment/$deployment" "$container=$REGISTRY/$image:$TAG"
          done
      - name: Wait for the rollout
        run: |
          for deployment in api prediction rag history-writer frontend; do
            if ! kubectl -n olea rollout status "deployment/$deployment" --timeout=10m; then
              echo "Rollout of $deployment failed, rolling back"
              kubectl -n olea rollout undo "deployment/$deployment"
              exit 1
            fi
          done

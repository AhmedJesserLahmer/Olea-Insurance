# CI/CD: unit tests -> smoke tests -> build & push images to Docker Hub -> deploy to Kubernetes
#
# Repository settings needed (Settings -> Secrets and variables -> Actions):
#   secrets.DOCKERHUB_USERNAME  Docker Hub user or organization (images: <user>/olea-<service>)
#   secrets.DOCKERHUB_TOKEN     Docker Hub access token (read/write)
#   secrets.KUBE_CONFIG         base64-encoded kubeconfig for the cluster   (deploy only)
#   vars.DEPLOY_ENABLED         "true" to run the deploy job                (deploy only)
# The cluster needs ingress-nginx and the olea-secrets Secret (see README, Kubernetes section).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  services-unit-tests:
    name: Unit tests (services)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/**/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend-build:
    name: Unit tests (frontend build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /

  helm-chart:
    name: Unit tests (Helm chart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.3
      - run: helm lint infrastructure/helm/olea
      - name: Render production and local values
        run: |
          helm template olea infrastructure/helm/olea -n olea > /dev/null
          helm template olea infrastructure/helm/olea -n olea -f infrastructure/helm/olea/values-local.yaml > /dev/null

  smoke-tests:
    name: Smoke tests (docker compose)
    needs: [services-unit-tests, frontend-build, helm-chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with throwaway secrets
        run: |
          sed -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=$(openssl rand -hex 32)/" \
              .env.example > .env
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Run smoke tests
        run: ./infrastructure/scripts/smoke_test.sh
        env:
          BASE_URL: http://localhost:8080
          SMOKE_TIMEOUT: "240"
      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  build-and-push:
    name: Build & push ${{ matrix.image }}
    needs: smoke-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each service builds from its own Dockerfile, with services/ as the context
          - image: olea-api
            context: services
            file: services/api/Dockerfile
          - image: olea-prediction
            context: services
            file: services/prediction/Dockerfile
          - image: olea-rag
            context: services
            file: services/rag/Dockerfile
          - image: olea-history-writer
            context: services
            file: services/history-writer/Dockerfile
          - image: olea-frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # The commit tag is what Kubernetes deploys; latest is only a convenience
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to Kubernetes (Helm)
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.3
      - name: Configure cluster access
        # Passed as an env var, not interpolated into the script, so the secret never
        # becomes part of the shell command text
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          umask 077
          printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
      - name: Upgrade the release to this commit's images
        # --atomic waits for every rollout and rolls the whole release back if one fails
        run: |
          helm upgrade --install olea infrastructure/helm/olea -n olea --create-namespace \
            --set imageRegistry="docker.io/${{ secrets.DOCKERHUB_USERNAME }}" \
            --set-string imageTag="${{ github.sha }}" \
            --atomic --timeout 15m
